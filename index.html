</head>
<body>
  <div class="app-container">
    <!-- Backdrop Overlay for Mobile Sidebar -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <span>Zyekh AI</span>
          <span class="brand-badge">COMPANION</span>
        </div>
      </div>

      <button class="btn-new-chat" id="btnNewChat" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Obrolan Baru
      </button>

      <!-- Sidebar Search Filter -->
      <div class="sidebar-search-wrap">
        <input 
          type="text" 
          class="sidebar-search-input" 
          id="sessionSearchInput" 
          placeholder="Cari riwayat obrolan..." 
          autocomplete="off" 
          aria-label="Cari riwayat obrolan"
        />
      </div>

      <div class="history-list" id="historyList">
        <!-- Riwayat Sesi Obrolan -->
      </div>

      <div class="sidebar-footer">
        <button class="sidebar-user-row" id="btnSidebarEditProfile" type="button" aria-label="Buka Pengaturan Profil">
          <div class="sidebar-user-info">
            <div class="profile-thumb" id="sidebarProfileThumb">U</div>
            <div class="sidebar-user-meta">
              <strong id="sidebarProfileName">User</strong>
              <span class="sidebar-user-status">
                <span class="status-indicator-dot"></span>
                <span>Gateway Active</span>
              </span>
            </div>
          </div>
          <svg class="sidebar-user-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main Chat View -->
    <main class="main-chat">
      <header class="chat-navbar">
        <div class="navbar-left">
          <button class="btn-menu-toggle" id="btnMenuToggle" type="button" aria-label="Buka Sidebar Riwayat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <!-- Dynamic Multi-Model Selector -->
          <div class="model-selector-wrap" id="modelSelectorWrap">
            <button class="model-select-btn" id="btnModelSelector" type="button" aria-haspopup="true" aria-expanded="false" title="Pilih Model AI">
              <span class="model-dot"></span>
              <span class="model-name" id="activeModelName">Gemini 3.7 Flash</span>
              <span class="model-badge-tag" id="activeModelBadge">Default</span>
              <svg class="model-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <div class="model-dropdown" id="modelDropdown" aria-hidden="true">
              <div class="model-dropdown-header">
                <span>PILIH MODEL AI</span>
                <span class="model-gateway-tag">[ GATEWAY 8317 ]</span>
              </div>
              <div class="model-options-list" id="modelOptionsList">
                <!-- Injected via app.js -->
              </div>
            </div>
          </div>
        </div>

        <div class="navbar-actions">
          <button class="btn-action" id="btnExportChat" type="button" title="Ekspor Obrolan ke Markdown" aria-label="Ekspor Obrolan">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span class="btn-text">Ekspor</span>
          </button>

          <button class="theme-toggle-btn" id="btnThemeToggle" type="button" title="Ganti Tema (Dark / Light)" aria-label="Ganti Tema">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="btn-text" id="themeLabel">Mode</span>
          </button>

          <button class="btn-action" id="btnClearChat" type="button" title="Bersihkan Obrolan Ini" aria-label="Bersihkan Obrolan">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span class="btn-text">Bersihkan</span>
          </button>
        </div>
      </header>

      <section class="chat-messages" id="chatMessages">
        <!-- Pesan akan dirender via app.js -->
      </section>

      <footer class="chat-input-wrapper">
        <form class="chat-form" id="chatForm">
          <textarea
            class="chat-input"
            id="chatInput"
            rows="1"
            placeholder="Ketik pesan atau ceritakan sesuatu..."
            autocomplete="off"
          ></textarea>
          <button type="submit" class="btn-send" id="btnSend" aria-label="Kirim Pesan">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="chat-input-hints">
          <span>[ Enter ] Kirim</span> &bull; <span>[ Shift + Enter ] Baris baru</span> &bull; <span id="hintActiveModel">Model: Gemini 3.7 Flash</span>
        </div>
      </footer>
    </main>
  </div>

  <!-- Profile & Avatar Customization Modal -->
  <div class="modal-backdrop" id="profileModalBackdrop" aria-hidden="true">
    <div class="modal-card" id="profileModal" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span class="modal-badge">[ PROFIL &amp; KUSTOMISASI ]</span>
          <h3 id="profileModalTitle">Pengaturan Profil Pengguna</h3>
        </div>
        <button class="modal-close-btn" id="btnProfileModalClose" type="button" aria-label="Tutup">&times;</button>
      </div>
      <form class="modal-body" id="profileForm">
        <div class="form-group">
          <label for="profileNameInput">Nama Pengguna / Display Name</label>
          <input type="text" id="profileNameInput" class="form-input" placeholder="Masukkan nama panggilan..." maxlength="40" required />
        </div>

        <div class="form-group">
          <label>Pilih Foto Profil (PP / Avatar)</label>
          <div class="avatar-preview-wrap">
            <div class="avatar-large" id="profileAvatarPreview">U</div>
            <div class="avatar-type-selector">
              <label class="radio-label"><input type="radio" name="avatarType" value="initial" checked /> Inisial Huruf</label>
              <label class="radio-label"><input type="radio" name="avatarType" value="preset" /> Preset Cyberpunk</label>
              <label class="radio-label"><input type="radio" name="avatarType" value="url" /> Custom URL / Upload</label>
            </div>
          </div>

          <!-- Preset Avatars Grid -->
          <div class="avatar-presets-grid" id="avatarPresetsGrid" style="display:none;">
            <!-- Rendered via JS -->
          </div>

          <!-- Custom URL / Upload Box -->
          <div class="avatar-custom-box" id="avatarCustomBox" style="display:none;">
            <input type="url" id="profileAvatarUrlInput" class="form-input" placeholder="https://example.com/avatar.png" />
            <div class="file-upload-wrap">
              <label for="profileAvatarFileInput" class="btn-file-upload">Upload Gambar dari Komputer</label>
              <input type="file" id="profileAvatarFileInput" accept="image/*" style="display:none;" />
              <span class="file-upload-hint" id="fileUploadHint">Maksimal 2MB (disimpan lokal di browser)</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="profileInstructionsInput">Instruksi Khusus untuk AI Companion (Opsional)</label>
          <textarea id="profileInstructionsInput" class="form-textarea" rows="3" placeholder="Contoh: Selalu jawab langsung ke inti masalah, gunakan analogi coding, panggil saya 'Bro'..." maxlength="500"></textarea>
          <span class="form-hint">Instruksi ini akan otomatis disematkan pada setiap percakapan.</span>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btnProfileModalCancel">Batal</button>
          <button type="submit" class="btn-primary" id="btnProfileModalSave">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./assets/js/app.js?v=20260821_v330"></script>
</body>
</html>
