<html lang="id">
<head>

  <link rel="canonical" href="https://chat.zyekh.com/" />
  <meta property="og:title" content="Zyekh AI Companion — Teman Cerita &amp; Diskusi Pintar" />

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Zyekh AI Companion",
    "url": "https://chat.zyekh.com/",
    "description": "High-Speed Private Conversational AI Companion by Zyekh",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "All",
    "author": {
      "@type": "Person",
      "name": "Zyekh Abdul Qadir Jailani",
      "url": "https://zyekh.com/about/"
    }
  }
  </script>

  <!-- Favicons & Manifest -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-icon-180x180.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Anti-Clickjack Protection -->
  <style id="antiClickjack">body{display:none !important;}</style>
  <script type="text/javascript">if(self===top){var ac=document.getElementById("antiClickjack");ac.parentNode.removeChild(ac);}else{top.location=self.location;}</script>

  <!-- Self-hosted Fonts & Styles -->
  <link as="font" crossorigin="" href="./assets/fonts/outfit-700-normal.woff2" rel="preload" type="font/woff2" />
  <link as="font" crossorigin="" href="./assets/fonts/inter-variable-latin.woff2" rel="preload" type="font/woff2" />
  <link rel="stylesheet" href="./assets/fonts/fonts.min.css?v=20260821_v303" />
  <link rel="stylesheet" href="./assets/css/app.css?v=20260821_v303" />
</head>
<body>
  <div class="app-container">
    <!-- Backdrop Overlay for Mobile Sidebar -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <span>Zyekh AI</span>
          <span class="brand-badge">COMPANION</span>
        </div>
      </div>

      <button class="btn-new-chat" id="btnNewChat" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Obrolan Baru
      </button>

      <!-- Sidebar Search Filter -->
      <div class="sidebar-search-wrap">
        <input 
          type="text" 
          class="sidebar-search-input" 
          id="sessionSearchInput" 
          placeholder="Cari riwayat obrolan..." 
          autocomplete="off" 
          aria-label="Cari riwayat obrolan"
        />
      </div>

      <div class="history-list" id="historyList">
        <!-- Riwayat Sesi Obrolan -->
      </div>

      <div class="sidebar-footer">
        <div style="display: flex; justify-content: space-between;">
          <a href="https://zyekh.com" target="_blank" rel="noopener">zyekh.com</a>
          <a href="https://shop.zyekh.com" target="_blank" rel="noopener">shop.zyekh.com</a>
        </div>
        <div style="font-size: 0.72rem; color: var(--text-faint); margin-top: 2px;">
          Zyekh Private AI • Local-First
        </div>
      </div>
    </aside>

    <!-- Main Chat View -->
    <main class="main-chat">
      <header class="chat-navbar">
        <div class="navbar-left">
          <button class="btn-menu-toggle" id="btnMenuToggle" type="button" aria-label="Buka Sidebar Riwayat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <div class="status-dot"></div>
          <div class="navbar-title-wrap">
            <h1>Zyekh AI Companion</h1>
            <span>Teman diskusi cerdas, interaktif &amp; reflektif</span>
          </div>
        </div>

        <div class="navbar-actions">
          <button class="theme-toggle-btn" id="btnThemeToggle" type="button" title="Ganti Tema (Dark / Light)" aria-label="Ganti Tema">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <span class="btn-text" id="themeLabel">Mode</span>
          </button>

          <button class="btn-action" id="btnClearChat" type="button" title="Bersihkan Obrolan Ini" aria-label="Bersihkan Obrolan">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span class="btn-text">Bersihkan</span>
          </button>
        </div>
      </header>

      <section class="chat-messages" id="chatMessages">
        <!-- Pesan akan dirender via app.js -->
      </section>

      <footer class="chat-input-wrapper">
        <form class="chat-form" id="chatForm">
          <textarea
            class="chat-input"
            id="chatInput"
            rows="1"
            placeholder="Ketik pesan atau ceritakan sesuatu..."
            autocomplete="off"
          ></textarea>
          <button type="submit" class="btn-send" id="btnSend" aria-label="Kirim Pesan">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
        <div class="chat-input-hints">
          <span>[ Enter ] Kirim</span> &bull; <span>[ Shift + Enter ] Baris baru</span>
        </div>
      </footer>
    </main>
  </div>

  <script src="./assets/js/app.js?v=20260821_v303"></script>
</body>
</html>
