<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zyekh AI Companion — Teman Cerita & Diskusi Pintar</title>
  <meta name="description" content="AI Companion interaktif dari Zyekh untuk teman ngobrol santai, diskusi ide, refleksi harian, dan asisten digital." />
  <link rel="stylesheet" href="./assets/css/app.css?v=20260817_v204" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <span>Zyekh AI</span>
          <span class="brand-badge">COMPANION</span>
        </div>
      </div>

      <button class="btn-new-chat" id="btnNewChat" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Obrolan Baru
      </button>

      <div class="history-list" id="historyList">
        <!-- Riwayat Sesi Obrolan -->
      </div>

      <div class="sidebar-footer">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-faint);">
          <a href="https://zyekh.com" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">zyekh.com</a>
          <a href="https://shop.zyekh.com" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">shop.zyekh.com</a>
        </div>
        <div style="font-size: 11px; color: var(--text-faint); margin-top: 4px; text-align: center;">
          Zyekh Private AI • Local-First
        </div>
      </div>
    </aside>

    <!-- Main Chat View -->
    <main class="main-chat">
      <header class="chat-navbar">
        <div class="navbar-left">
          <button class="btn-menu-toggle" id="btnMenuToggle" type="button" aria-label="Toggle Sidebar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80;"></div>
            <div>
              <h1 style="font-size: 15px; font-weight: 600; color: var(--text-main); margin: 0; line-height: 1.2;">Zyekh AI Companion</h1>
              <span style="font-size: 11.5px; color: var(--text-muted);">Teman diskusi cerdas, interaktif & reflektif</span>
            </div>
          </div>
        </div>

        <div class="navbar-actions">
          <button class="btn-action" id="btnClearChat" type="button" title="Bersihkan Obrolan Ini">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Bersihkan
          </button>
        </div>
      </header>

      <section class="chat-messages" id="chatMessages">
        <!-- Pesan akan dirender via app.js -->
      </section>

      <footer class="chat-input-wrapper">
        <form class="chat-form" id="chatForm">
          <textarea
            class="chat-input"
            id="chatInput"
            rows="1"
            placeholder="Ketik pesan atau ceritakan sesuatu..."
            autocomplete="off"
          ></textarea>
          <button type="submit" class="btn-send" id="btnSend" aria-label="Kirim Pesan">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <script src="./assets/js/app.js?v=20260817_v204"></script>
</body>
</html>
